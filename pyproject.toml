[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physics-llm-sr"
version = "0.1.0"
description = "Reprodução científica de regressão simbólica informada por física com LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "sympy",
    "pydantic>=2",
    "pyyaml",
    "deap",
    "gplearn>=0.4.2,<0.5",
    # Teto do scikit-learn: gplearn 0.4.x chama BaseEstimator._validate_data,
    # deprecado no 1.6 (so avisa) e removido no 1.7. Revisar ao atualizar o gplearn.
    "scikit-learn>=1.3,<1.7",
    # Série validada do mecanismo in-loop (sr.pysr_adapter.check_pysr_version).
    "pysr>=2.7.2,<2.8",
    "matplotlib",
    "requests",
    "tqdm",
    "nbformat",
]

[project.scripts]
physics-llm-sr = "physics_llm_sr.cli:main"

[project.optional-dependencies]
hf = ["transformers", "accelerate", "torch"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-requests",
    "types-tqdm",
    "pandas-stubs",
    "nbconvert",
    "ipykernel",
]

[tool.hatch.build.targets.wheel]
packages = ["src/physics_llm_sr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: testes lentos (opt-in)",
    "julia: testes que exigem PySR/Julia (opt-in)",
    "llm_real: testes com Ollama/transformers reais (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["deap.*", "gplearn.*", "pysr.*", "sklearn.*", "scipy.*", "sympy.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
