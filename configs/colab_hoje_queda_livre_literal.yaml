# Controle LITERAL da execução de hoje (rodar só se sobrar tempo): mesmo que colab_hoje_queda_livre.yaml,
# track paper_replication com perda literal (GAP-01/02), apenas P1 (Exp1 baseline + Exp2 llm_integration, prompt E).
# PySR reduzido continua sendo desvio declarado (ver comentário em sr.pysr).
mode: pilot
track: paper_replication
seeds:
  master: 42
physics:
  sampling:
    mass: {low: 0.1, high: 10.0}      # kg (artigo)
    length: {low: 0.01, high: 0.5}    # m (artigo)
    height: {low: 1.0, high: 100.0}   # m (artigo)
    damping: {low: 0.0, high: 1.0}    # 1/s (artigo)
  free_fall:
    gravity: 9.81                     # m/s^2
  harmonic_motion:
    spring_constant: 10.0             # N/m [hipótese GAP-03]
    phase: 0.0                        # rad [hipótese GAP-03]
  damped_wave:
    amplitude: 1.0                    # V/m [hipótese GAP-03]
    wave_number: 6.283185307179586    # rad/m = 2*pi [hipótese GAP-03]
    angular_frequency: 6.283185307179586  # rad/s = 2*pi [hipótese GAP-03]
data:
  n_simulations: 500                  # artigo (piloto usa dados completos)
  n_time_points: 100                  # ~50 000 amostras/cenário (artigo)
  max_steps: 1000                     # artigo
  split: {train: 0.70, validation: 0.15, test: 0.15}  # [hipótese GAP-09]
  noise: {sigma_fraction: 0.01, location: target}     # artigo: 1% do desvio-padrão
  exp4:
    levels: [0.01, 0.03, 0.05]
    locations: [target]               # só no ALVO (hoje)
  exp5:
    mean_fraction: 0.01               # artigo: 1% da média do atributo
    levels: [0.01, 0.05]
    locations: [target]               # só no ALVO (hoje)
symbolic:
  division_epsilon: 0.001             # GAP-06: |den| < 0.001 -> 1
  division_fallback: 1.0
  log_epsilon: 0.001                  # GAP-06: |x| < 0.001 -> 0; senão log|x|
  exp_clip: 100.0                     # GAP-06
  power_clip: 1.0e6
  tree_distance_constant_penalty: 1.0 # GAP-10: alpha = 1.0
  tree_distance:
    descend_on_operator_mismatch: true  # GAP-10
    canonicalize: true                  # GAP-10
sr:
  population: 100
  generations: 50
  early_stopping: {enabled: true, min_relative_improvement: 0.001, patience: 3}
  deap:
    crossover_prob: 0.05              # artigo
    mutation_prob: 0.01               # artigo
    tournament_size: 3                # artigo
    max_depth: 8                      # artigo
    init_min_depth: 1                 # [hipótese]
    init_max_depth: 3                 # [hipótese]
  gplearn:
    parsimony_coefficient: 0.001      # [hipótese]
    tournament_size: 3                # [hipótese H-02] uniforme com DEAP (artigo não informa)
    p_crossover: 0.9                  # [hipótese] default gplearn 0.4.2
    p_subtree_mutation: 0.01          # [hipótese] default gplearn 0.4.2
    p_hoist_mutation: 0.01            # [hipótese] default gplearn 0.4.2
    p_point_mutation: 0.01            # [hipótese] default gplearn 0.4.2
    init_depth: [1, 8]                # [hipótese H-02]
    const_range: [-1.0, 1.0]          # [hipótese H-03] default gplearn 0.4.2
  pysr:
    loss: huber                       # GAP-05: Huber no termo e, conforme artigo
    huber_delta: 1.0                  # [hipótese GAP-05]
    # DESVIO DECLARADO (orçamento de ~4 h no A100): PySR REDUZIDO frente ao piloto
    # (1 população x 100 indivíduos, 50 iterações, 380 ciclos) e ao artigo: 1 população de 50,
    # 50 ciclos por iteração, 10 iterações. O early stopping continua ativo. Resultados do PySR
    # hoje não são comparáveis em esforço com DEAP/gplearn (100 x 50) nem com o artigo.
    niterations: 10                   # desvio (piloto: sr.generations = 50)
    populations: 1                    # [hipótese H-02]
    population_size: 50               # desvio (piloto: 100)
    ncycles_per_iteration: 50         # desvio (piloto: 380)
    maxsize: 30                       # [hipótese] default PySR 2.x
    tournament_selection_n: 15        # [hipótese] default PySR 2.x
  operators:
    deap: [add, sub, mul, div, neg, exp, log, sin, cos]          # GAP-06 (div protegido)
    gplearn: [add, sub, mul, div, neg, exp, log, sin, cos]       # GAP-06
    pysr: [add, sub, mul, div, pow, neg, exp, log, sin, cos]     # GAP-06 (^ = pow)
loss:
  w1: 0.3333333333333333              # [hipótese GAP-01] pesos iguais; grade de sensibilidade à parte
  w2: 0.3333333333333333
  w3: 0.3333333333333334
  normalization: literal              # GAP-02: e=MSE em SI, s=nº de nós, c em [0,1]
  baseline_weights: [0.5, 0.5, 0.0]  # GAP-01: baseline sem LLM (w3=0, w1:w2 renormalizados)
llm:
  backend: transformers
  temperature: 0.0
  max_new_tokens: 256
  max_retries: 3
  failure_policy: retry
  prompt_variants: [A, C, E, H]      # Exp3: sem contexto / experimento / variáveis+experimento / tudo com GT revelada
  cache_enabled: true
  cache_dir: .cache/llm
  cache_significant_digits: 3        # GAP-14: constantes a 3 algarismos significativos na chave
  cache_key_mode: exact               # 'structure' só em extended_analysis (desvio)
  ollama_endpoint: http://localhost:11434   # usado só com backend ollama
  evaluation_scope: all               # replication: todos os candidatos únicos, com cache
  batch_size: 16                      # DEAP/gplearn avaliam a geração em lote (A100)
  request_timeout_s: 120.0
  seed: 42
  models:                             # GAP-07
    - {name: mistral, checkpoint: mistralai/Mistral-7B-Instruct-v0.1, revision: ec5deb64f2c6e6fa90c1abf74a91d5c93a9669ca, quantization: fp16, infra: colab-a100}
    - {name: llama2, checkpoint: meta-llama/Llama-2-7b-chat-hf, revision: f5db02db724555f92da89c216ac04704f23d4590, quantization: fp16, infra: colab-a100}   # restrito: exige HF_TOKEN; só roda se listado em experiments.models
    - {name: falcon, checkpoint: tiiuae/falcon-7b-instruct, revision: 8782b5c5d8c9290412416618f36a133653e85285, quantization: fp16, infra: colab-a100}
experiments:
  run: [baseline, llm_integration]    # controle: só P1
  repetitions: 3
  scenarios: [free_fall]
  algorithms: [deap, gplearn, pysr]
  models: [mistral]
  benchmark_prompt: E               # Exp2 (Tabela 5): piloto usa o prompt E
  noise_model: mistral                # Exp4/5: LLM das Tabelas 3/4 [hipótese GAP-12]
  noise_prompt: E                     # Exp4/5: prompt das Tabelas 3/4 [hipótese GAP-12]
  max_cell_seconds: 1800             # célula que estoura vira `error` registrado
output_dir: results/colab_hoje_queda_livre_literal
