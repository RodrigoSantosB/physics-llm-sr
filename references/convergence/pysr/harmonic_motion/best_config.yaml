nota: 'Não convergiu (rodada O15). Perda normalizada (MSE/Var, nós/30) com w=(0,9;0,1): a busca chega
  a length*cos(t*(a + b/(c - mass))) (aproximação racional de 1/sqrt(mass); 1-R2 1e-3..2e-1) e não troca
  por sqrt(mass). Uma exploração com dados completos achou uma forma numericamente exata mas inchada (22
  nós; distância 1). w=(0,5;0,5) devolve constante. Próxima alavanca: mais iterações/diversidade com dados
  completos (>= 25 min por execução nesta CPU) ou operador de otimização de expoente (pow com restrição
  de base variável).'
